name: Guardian Prime PostgreSQL Safety Gate
on:
  pull_request:
  push:
    branches:
      - main
      - 'dev/guardian-prime-*'
jobs:
  db-gate:
    runs-on: ubuntu-latest
    env:
      TEST_DB: guardian_prime_test
      GP_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify test database provisioning is configured
        run: |
          test -x scripts/migrate-test-db.sh
          test -x test/bin/run_guardian_prime_db_gate.sh
      - name: Provision and migrate isolated test database
        run: scripts/migrate-test-db.sh
      - name: Missing run-ID negative test
        run: bash test/bin/test_gate08_missing_run_id.sh
      - name: Required PostgreSQL regression gate
        run: bash test/bin/run_guardian_prime_db_gate.sh
      - name: Always-run test cleanup
        if: always()
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql -X -v ON_ERROR_STOP=1 -d "$TEST_DB" \
              -v run_id="$GP_TEST_RUN_ID" \
              -c "SELECT guardian_prime_test.cleanup_concurrency_sessions(:'run_id'); SELECT guardian_prime_test.cleanup_idempotency_concurrency(:'run_id');"
          fi
